<text x="463.0" y="265.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Harm</text>
<text x="463.0" y="278.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">who can the agent hurt?</text>
<rect x="608" y="230" width="258" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="614" y="236" width="31" height="16" rx="4" fill="#ececec"/>
<text x="629.5" y="248" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LIVE</text>
