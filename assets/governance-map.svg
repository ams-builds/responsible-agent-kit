<text x="600.0" y="122.1" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3142">Your AI agent at work</text>
<text x="600.0" y="135.1" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">the agent you put to work</text>
<line x1="600" y1="152" x2="600" y2="186" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="190" width="1120" height="228" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
<text x="60" y="214" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#7a8399">THE QUESTIONS TO ANSWER</text>
<rect x="60" y="230" width="258" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="66" y="236" width="31" height="16" rx="4" fill="#ececec"/>
<text x="81.5" y="248" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LIVE</text>
<text x="189.0" y="265.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Identity</text>
<text x="189.0" y="278.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">is the agent really yours?</text>
<rect x="334" y="230" width="258" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="340" y="236" width="31" height="16" rx="4" fill="#ececec"/>
