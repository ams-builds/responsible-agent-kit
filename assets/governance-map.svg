<svg viewBox="0 0 1200 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">The responsible agent map</title>
<desc id="desc">Your AI agent at work must answer nine questions: identity, harm, risk tier, delegated authority, audit trail, behavioral rules, sovereignty, incident response and green agents. Each question has a kit, and one install gives you all nine.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#eb6c36"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="616" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">The responsible agent map</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">NINE QUESTIONS FOR AN AGENT AT WORK</text>
<rect x="450" y="96" width="300" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="600.0" y="122.1" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3142">Your AI agent at work</text>
<text x="600.0" y="135.1" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">the agent you put to work</text>
<line x1="600" y1="152" x2="600" y2="186" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="190" width="1120" height="320" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
<text x="60" y="214" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#7a8399">THE QUESTIONS TO ANSWER</text>
<rect x="60" y="230" width="349" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="66" y="236" width="31" height="16" rx="4" fill="#ececec"/>
<text x="81.5" y="248" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LIVE</text>
<text x="234.5" y="265.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Identity</text>
<text x="234.5" y="278.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">is the agent really yours?</text>
<rect x="425" y="230" width="349" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="431" y="236" width="31" height="16" rx="4" fill="#ececec"/>
<text x="446.5" y="248" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LIVE</text>
<text x="599.5" y="265.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Harm</text>
<text x="599.5" y="278.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">who can the agent hurt?</text>
<rect x="790" y="230" width="349" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="796" y="236" width="31" height="16" rx="4" fill="#ececec"/>
<text x="811.5" y="248" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LIVE</text>
<text x="964.5" y="265.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Risk tier</text>
<text x="964.5" y="278.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">how much control does it need?</text>
<rect x="60" y="322" width="349" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="66" y="328" width="31" height="16" rx="4" fill="#ececec"/>
<text x="81.5" y="340" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LIVE</text>
<text x="234.5" y="357.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Delegated authority</text>
<text x="234.5" y="370.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">who gave it permission?</text>
<rect x="425" y="322" width="349" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="431" y="328" width="31" height="16" rx="4" fill="#ececec"/>
<text x="446.5" y="340" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LIVE</text>
<text x="599.5" y="357.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Audit trail</text>
<text x="599.5" y="370.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">can you prove what it did?</text>
<rect x="790" y="322" width="349" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="796" y="328" width="31" height="16" rx="4" fill="#ececec"/>
<text x="811.5" y="340" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LIVE</text>
<text x="964.5" y="357.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Behavioral rules</text>
<text x="964.5" y="370.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">what must it never do?</text>
<rect x="60" y="414" width="349" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="66" y="420" width="31" height="16" rx="4" fill="#ececec"/>
<text x="81.5" y="432" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LIVE</text>
<text x="234.5" y="449.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Sovereignty</text>
<text x="234.5" y="462.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">where does the data go?</text>
<rect x="425" y="414" width="349" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="431" y="420" width="31" height="16" rx="4" fill="#ececec"/>
<text x="446.5" y="432" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LIVE</text>
<text x="599.5" y="449.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Incident response</text>
<text x="599.5" y="462.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">what if it goes wrong?</text>
<rect x="790" y="414" width="349" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="796" y="420" width="31" height="16" rx="4" fill="#ececec"/>
<text x="811.5" y="432" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LIVE</text>
<text x="964.5" y="449.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Green agents</text>
<text x="964.5" y="462.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">what does it cost the planet?</text>
<text x="600" y="540" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" font-weight="600" letter-spacing="0.06em" fill="#7a8399">NINE KITS. ONE INSTALL.</text>
<line x1="40" y1="560" x2="1160" y2="560" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="40" y="586" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">STATUS</text>
<rect x="120" y="576" width="31" height="16" rx="4" fill="#ececec"/>
<text x="135.5" y="588" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LIVE</text>
<text x="161" y="588" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">a kit you can use today</text>
<rect x="640.0" y="576" width="30" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="680.0" y="588" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">your agent</text>
